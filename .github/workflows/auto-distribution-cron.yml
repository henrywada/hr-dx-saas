name: Auto Distribution Cron

on:
  # スケジュール実行は停止中（手動の workflow_dispatch のみ残す）。
  # 理由: リポジトリシークレット DISTRIBUTION_CRON_SECRET が空のため、
  # 毎日 4:00 JST の実行が POST /api/auto-distribution/run-due で HTTP 500 になる。
  # 再開手順: DISTRIBUTION_CRON_SECRET を設定したうえで、下の schedule のコメントを外す。
  # schedule:
  #   # 毎日 4:00 JST（UTC 19:00。日本にDSTなし）
  #   - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-due-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto distribution run
        run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/auto-distribution/run-due" \
            -H "x-cron-secret: ${{ secrets.DISTRIBUTION_CRON_SECRET }}"
